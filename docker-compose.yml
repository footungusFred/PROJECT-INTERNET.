services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: internet
      POSTGRES_PASSWORD: internet
      POSTGRES_DB: project_internet
    ports:
      - "5432:5432"
    volumes:
      - internet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internet -d project_internet"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  internet_pgdata:
